<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenGuard 관제</title>
<style>
  :root { --bg:#f5f6f7; --panel:#fff; --line:#dfe4e7; --text:#14202a; --muted:#61707a;
          --ok:#2f9e6f; --watch:#d18a12; --urgent:#d6453d; --ai:#2f6fd6; --unknown:#8a959c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --bg:#0f1418; --panel:#172026; --line:#28343c; --text:#e8eef1; --muted:#93a3ac; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:17px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 40px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  header h1 { margin:0; font-size:24px; }
  .chip { font-size:14px; padding:4px 12px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .lvl-normal{--c:var(--ok)} .lvl-watch{--c:var(--watch)} .lvl-urgent{--c:var(--urgent)} .lvl-ai{--c:var(--ai)} .lvl-unknown{--c:var(--unknown)}
  .item { display:grid; grid-template-columns:56px 1fr auto; gap:16px; align-items:center; background:var(--panel);
          border:1px solid var(--line); border-left:8px solid var(--c); padding:18px 20px; margin-bottom:12px; cursor:pointer; }
  .item .no { font-size:34px; font-weight:700; color:var(--c); text-align:center; }
  .item .name { font-size:22px; font-weight:700; }
  .item .state { color:var(--c); font-weight:700; }
  .item .why { color:var(--muted); margin-top:2px; }
  .item .todo { font-weight:600; margin-top:4px; }
  .item .go { color:var(--muted); font-size:14px; }
  .live { display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); padding:12px 18px; margin-top:6px; }
  .live svg { flex:1; height:36px; }
  .live b { font-size:20px; min-width:80px; }
  .muted { color:var(--muted); font-size:14px; }
  .detail { background:var(--panel); border:1px solid var(--line); border-top:8px solid var(--c); padding:22px; margin-top:18px; }
  .detail h2 { margin:0 0 6px; font-size:24px; }
  .lead { font-size:19px; margin:4px 0 16px; }
  .cmp { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:16px; }
  .cmp > div { border:1px solid var(--line); padding:12px 14px; }
  .cmp .v { font-size:26px; font-weight:700; color:var(--c); }
  .cmp .u { font-size:14px; color:var(--muted); }
  .bar { height:12px; background:var(--line); position:relative; margin:6px 0 4px; }
  .bar i { position:absolute; inset:0 auto 0 0; background:var(--c); }
  .bar s { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--text); }
  ol { margin:6px 0 16px 22px; padding:0; } ol li { margin:3px 0; }
  .sec { font-size:14px; color:var(--muted); font-weight:600; margin:16px 0 4px; }
  details { margin-top:16px; } summary { cursor:pointer; color:var(--muted); font-size:15px; }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
  td,th { text-align:left; padding:5px 4px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-weight:500; }
  @media (max-width:640px) { .item { grid-template-columns:40px 1fr; } .item .go { display:none; } .item .no { font-size:26px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GenGuard · 정비 우선순위</h1>
    <span class="chip" id="chip">판정 엔진 확인 중</span>
  </header>
  <div id="list"></div>
  <div class="live"><span class="muted">실측 진동 (UNO Q IMU)</span><b id="lv">-</b><svg id="ls" viewBox="0 0 300 36" preserveAspectRatio="none"></svg></div>
  <div class="detail" id="detail" hidden></div>
</div>
<script type="module">
import { PROFILE, createDemoState, makeScenario, evaluate } from './vendor/engine.mjs';
import { estimateOilLimitTime } from './vendor/trend.mjs';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const KGF = 0.980665;
const NAMES = { 'GEN-10K-001': '1호기', 'GEN-10K-002': '2호기', 'GEN-10K-003': '3호기' };
const LABEL = { engine_rpm:['회전수','rpm',1], coolant_c:['냉각수 온도','°C',1], oil_bar:['윤활유 압력','kgf/cm²',1/KGF],
  voltage_v:['출력 전압','V',1], vibration_rms_g:['진동 세기','g',1], envelope_cv:['진동 간헐성','',1] };
const CHECKS = { coolant_c:'냉각수량·누수·라디에이터 통풍 확인', oil_bar:'윤활유량·누유·오일 필터 확인',
  engine_rpm:'연료 공급·조속기 상태 확인', voltage_v:'전압조정기(AVR)·결선 확인',
  vibration_rms_g:'고정 볼트·방진 마운트·센서 부착 확인', envelope_cv:'간헐 충격원·체결 상태 확인' };
const assets = Object.keys(NAMES).map(id => ({ id, run: 0, scenario: 'normal', ramp: false, oil: null, t: 0,
  state: createDemoState(), history: [], res: null, ai: null }));
let open = null, fast = false; const live = [];

function level(a) {
  const al = a.res?.alerts ?? [], ai = a.ai?.display_state;
  if (al.some(x => x.severity === 'urgent')) return ['urgent', '긴급', 'urgent'];
  if (al.length && ai === 'inspection_suggested') return ['watch', '점검 필요', 'both'];
  if (ai === 'inspection_suggested') return ['ai', '점검 필요', 'ai2'];
  if (al.length) return ['watch', '점검', 'watch'];
  if (ai === 'change_observed') return ['ai', '확인 중', 'ai1'];
  if (ai === 'unknown' || a.res?.coverage?.complete === false) return ['unknown', '판단 보류', 'unk'];
  return ['normal', '정상', 'ok'];
}
const ORDER = { urgent: 6, both: 5, ai2: 4, watch: 3, ai1: 2, unk: 1, ok: 0 };
const ratio = a => a.ai?.score != null && a.ai?.threshold ? a.ai.score / a.ai.threshold : 0;
const odd = a => (a.ai?.evidence ?? []).filter(e => Math.abs(e.standardized_residual) >= 3);
const fmt = (k, v) => { const [, , f] = LABEL[k] ?? ['', '', 1]; const x = v * f; return Math.abs(x) < 1 ? x.toFixed(3) : +x.toFixed(1); };

function summary(a) {
  const [, , key] = level(a), al = a.res?.alerts ?? [];
  if (al.length) return [al.map(x => x.title).join(' · '), al[0]?.checks?.[0] ?? ''];
  if (key === 'ai2' || key === 'ai1') {
    const o = odd(a); const what = o.map(e => `${LABEL[e.field]?.[0] ?? e.field} ${e.standardized_residual > 0 ? '↑' : '↓'}`).join(' ');
    return [`${what || '여러 값'} · 같은 부하에서 평소와 다름`, o[0] ? CHECKS[o[0].field] : '지속 여부 확인'];
  }
  if (key === 'unk') return [a.ai?.reason?.startsWith('missing') ? '컨트롤러 값 미수신' : a.ai?.reason === 'unseen_operating_context' ? '학습하지 않은 운전 조건' : '예열·정지 중', '값 수신과 운전 상태 확인'];
  return ['이상 없음', ''];
}

function renderList() {
  const sorted = [...assets].sort((x, y) => (ORDER[level(y)[2]] - ORDER[level(x)[2]]) || (ratio(y) - ratio(x)));
  $('list').innerHTML = sorted.map((a, i) => { const [c, txt] = level(a), [why, todo] = summary(a);
    return `<div class="item lvl-${c}" data-id="${a.id}"><div class="no">${i + 1}</div>
      <div><div class="name">${NAMES[a.id]} <span class="state">· ${txt}</span></div><div class="why">${esc(why)}</div>
      ${todo ? `<div class="todo">→ ${esc(todo)}</div>` : ''}</div><div class="go">${open === a.id ? '닫기' : '자세히'}</div></div>`; }).join('');
  for (const el of $('list').children) el.onclick = () => { open = open === el.dataset.id ? null : el.dataset.id; renderList(); renderDetail(); };
}

function renderDetail() {
  const a = assets.find(x => x.id === open);
  if (!a || !a.res) { $('detail').hidden = true; return; }
  const [c, txt, key] = level(a), [why] = summary(a), ai = a.ai ?? {}, al = a.res.alerts;
  const lead = key === 'ai2' || key === 'ai1' ? '고정 기준 안의 값이지만, 같은 부하·외기온에서 평소 관계와 다릅니다.'
    : key === 'both' ? '정해진 기준을 넘었고, AI도 평소 관계와 지속적으로 다르다고 판단했습니다.'
    : al.length ? '정해진 기준을 넘었습니다.' : key === 'unk' ? '판단할 수 있는 값이 부족합니다. 정상으로 표시하지 않습니다.' : '규칙 기준과 평소 패턴 모두 이상 없습니다.';
  const o = odd(a);
  const cmp = (o.length ? o : (ai.evidence ?? []).slice(0, 2)).map(e => `<div><div class="muted">${LABEL[e.field]?.[0] ?? e.field}</div>
    <div><span class="v">${fmt(e.field, e.value)}</span> <span class="u">${LABEL[e.field]?.[1] ?? ''} · 평소 ${fmt(e.field, e.expected)}</span></div></div>`).join('');
  const checks = [...new Set([...al.flatMap(x => x.checks ?? []), ...o.map(e => CHECKS[e.field]).filter(Boolean)])].slice(0, 3);
  const tr = estimateOilLimitTime(a.history);
  const max = ai.threshold ? Math.max(ai.threshold * 3, ai.score * 1.1) : 1;
  $('detail').className = `detail lvl-${c}`; $('detail').hidden = false;
  $('detail').innerHTML = `<h2>${NAMES[a.id]} · ${txt}</h2><div class="lead">${esc(lead)}</div>
    ${cmp ? `<div class="cmp">${cmp}</div>` : ''}
    ${ai.score != null ? `<div class="sec">AI 판정 (평소 관계와의 거리)</div><div class="bar"><i style="width:${Math.min(100, ai.score / max * 100)}%"></i><s style="left:${ai.threshold / max * 100}%"></s></div>
      <div class="muted">${ai.score.toFixed(1)} / 기준선 ${ai.threshold.toFixed(1)} · 고장 확률이 아닙니다</div>` : ''}
    ${checks.length ? `<div class="sec">점검 순서</div><ol>${checks.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
    ${tr.status === 'estimated' ? `<div class="sec">${esc(tr.label)}</div><div><b style="font-size:24px">약 ${tr.minutes.toFixed(0)}분</b> <span class="muted">현재 추세 유지 가정 · 고장 시점 아님</span></div>` : ''}
    <details><summary>전체 계측값 · 기술 정보</summary>
      <table><tr><th>항목</th><th>값</th><th>상태</th></tr>${Object.entries(a.res.metrics).map(([k, m]) => `<tr><td>${esc(PROFILE.fields.find(f => f.key === k)?.label ?? k)}</td><td>${typeof m.value === 'number' ? +m.value.toFixed(3) : '—'} ${esc(m.unit ?? '')}</td><td>${esc(m.status)}</td></tr>`).join('')}</table>
      <p class="muted">발전기 값은 모의 입력입니다. AI: ${esc(ai.engine ?? '-')} · 모델 ${esc(ai.model_id ?? '-')} · 연속 ${ai.streak ?? 0}/${ai.persistence_windows ?? 3} · 추론 ${ai.inference_ms ?? '-'} ms · ${esc(why)}</p>
      ${tr.status !== 'estimated' ? `<p class="muted">유압 추세: ${esc(tr.message ?? tr.reason)}</p>` : ''}</details>`;
}

async function stepAsset(a, ctl) {
  if (ctl.run !== a.run) { Object.assign(a, { run: ctl.run, scenario: ctl.scenario, ramp: ctl.ramp, oil: null, t: 0, state: createDemoState(), history: [] }); }
  a.t += fast ? 10 : 1;
  const snap = makeScenario(a.scenario, a.t); snap.scenario_id = `${a.id}-${a.run}`;
  if (a.ramp && snap.readings.oil_kgf_cm2) { a.oil = Math.max(0.3, (a.oil ?? snap.readings.oil_kgf_cm2.value) - 0.002 * (fast ? 10 : 1)); snap.readings.oil_kgf_cm2.value = +a.oil.toFixed(3); }
  a.res = evaluate(snap, a.state);
  try { a.ai = await (await fetch('/api/score', { method: 'POST', body: JSON.stringify({ asset_id: `${a.id}-${a.run}`, t_s: snap.t_s, phase: snap.phase, readings: snap.readings }) })).json(); }
  catch { a.ai = { display_state: 'unknown', reason: 'server_unreachable' }; }
  const r = snap.readings;
  if (r.oil_kgf_cm2) { a.history.push({ t_s: snap.t_s, phase: snap.phase, oil_kgf_cm2: r.oil_kgf_cm2.value, engine_rpm: r.engine_rpm?.value, load_pct: r.load_pct?.value, ambient_c: r.ambient_c?.value, source: 'scenario', quality: 'ok' }); if (a.history.length > 90) a.history.shift(); }
}

async function loop() {
  let ctl; try { ctl = await (await fetch('/api/control')).json(); } catch { return; }
  fast = ctl.fast;
  for (const a of assets) await stepAsset(a, ctl.assets[a.id]);
  renderList(); renderDetail();
}
async function head() {
  try { const s = await (await fetch('/api/status')).json();
    $('chip').textContent = `${s.engine.startsWith('clikart') ? 'ClikaRT 온디바이스 AI' : s.engine} · ${s.network_reachable ? '온라인' : '오프라인 동작'}`; } catch {}
}
async function liveLoop() {
  try { const l = await (await fetch('/api/live')).json();
    if (l.rms_g != null && l.age_s < 3) { live.push(l.rms_g); $('lv').textContent = l.rms_g.toFixed(3) + ' g'; } else $('lv').textContent = l.connected ? '대기' : '미연결';
    if (live.length > 120) live.shift(); const mx = Math.max(0.02, ...live);
    $('ls').innerHTML = `<polyline fill="none" stroke="var(--ai)" stroke-width="2" points="${live.map((v, i) => `${i * 300 / 119},${34 - v / mx * 32}`).join(' ')}"/>`; } catch {}
}
head(); setInterval(head, 10000); setInterval(loop, 1000); setInterval(liveLoop, 500);
</script>
</body>
</html>
